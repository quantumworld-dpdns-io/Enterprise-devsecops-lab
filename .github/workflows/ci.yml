name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/demo-app

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over full history
        run: |
          docker run --rm -v "$PWD:/src" -w /src zricethezav/gitleaks:v8.21.2 \
            git /src --config /src/.gitleaks.toml --no-banner --redact
      - run: ./scripts/scan.sh secrets

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/scan.sh lint-yaml lint-tf lint-ansible lint-docker helm kubeconform

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: go -C app vet ./...
      - run: go -C app test -race -count=1 -coverprofile=coverage.out ./...
      - run: ./scripts/scan.sh policy policy-kyverno

  sast-sca:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/scan.sh sast-semgrep sast-gosec sca-govuln sca-trivy
      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./scripts/scan.sh iac-checkov iac-trivy
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt + validate
        run: |
          terraform fmt -check -recursive terraform
          for d in terraform/environments/*; do
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Ansible collections
        run: |
          pip install "ansible-core==2.17.7"
          ansible-galaxy collection install -r ansible/requirements.yml -p ansible/.collections
      - name: molecule test linux-hardening (same containerized runner as `make molecule`)
        run: ./scripts/molecule.sh linux-hardening

  build:
    needs: [secrets, lint, test, sast-sca, iac]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing via GitHub OIDC
      attestations: write   # SLSA build provenance
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build for scanning
        run: docker build -t demo-app:dev --build-arg VERSION=${{ github.sha }} app
      - name: Image scan + SBOM
        run: ./scripts/scan.sh image sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: reports/sbom.cdx.json
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag demo-app:dev "$IMAGE_NAME:${GITHUB_SHA::12}"
          docker push "$IMAGE_NAME:${GITHUB_SHA::12}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:${GITHUB_SHA::12}" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
        if: steps.push.outputs.digest != ''
      - name: Sign image and attach SBOM attestation (keyless)
        if: steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_NAME@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate reports/sbom.cdx.json "$IMAGE_NAME@$DIGEST"
          cosign verify "$IMAGE_NAME@$DIGEST" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: SLSA build provenance (signed, pushed to the registry)
        if: steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify SBOM attestation (cosign)
        if: steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # cosign verifies only attestations cosign itself attached (the
          # CycloneDX SBOM above). It cannot enumerate the SLSA provenance
          # stored by actions/attest-build-provenance as a GitHub attestation
          # / Sigstore bundle, so do not ask cosign for slsaprovenance here.
          cosign verify-attestation "$IMAGE_NAME@$DIGEST" --type cyclonedx \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "SBOM attestation verified for $IMAGE_NAME@$DIGEST"
      - name: Verify provenance the way the admission policy will
        if: steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub-native verification: reads the provenance created by
          # actions/attest-build-provenance (predicate
          # https://slsa.dev/provenance/v1) from GitHub attestations / the
          # registry for this repository. Output is left visible so a failure
          # shows the predicate type and signer identity.
          gh attestation verify "oci://$IMAGE_NAME@$DIGEST" --repo "${{ github.repository }}"
          echo "provenance verified for $IMAGE_NAME@$DIGEST"

  e2e:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Cluster, platform, deploy
        run: make up
      - name: End-to-end checks
        run: make e2e
      - name: DAST (OWASP ZAP baseline)
        run: make dast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: reports/zap*
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --kubeconfig .kube/lab.yaml get pods -A -o wide
          kubectl --kubeconfig .kube/lab.yaml get events -A --sort-by=.lastTimestamp | tail -50
      - name: Tear down
        if: always()
        run: make down
