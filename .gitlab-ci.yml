# GitLab CI equivalent of .github/workflows/ci.yml, for a self-hosted GitLab with a
# Docker-executor runner (see gitlab/). Jobs call the same scripts/scan.sh, so a finding
# reproduces identically on a laptop, on GitHub and on GitLab.
#
# Runner requirement (gitlab/runner-config.example.toml): docker executor, host Docker
# socket mounted, and /builds bind-mounted at the SAME path on the host, because scan.sh
# starts sibling tool containers that mount $CI_PROJECT_DIR by host path. Tag: lab-docker.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - secrets
  - lint
  - test
  - sast
  - sca
  - iac-scan
  - policy
  - build
  - sbom
  - sign
  - deploy   # ephemeral cluster + e2e + DAST

default:
  image: docker:27-cli
  tags: [lab-docker]
  before_script:
    - apk add --no-cache bash git curl make >/dev/null
  interruptible: true

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/demo-app
  GIT_DEPTH: "0"

secrets:gitleaks:
  stage: secrets
  script:
    - >-
      docker run --rm -v "$CI_PROJECT_DIR:/src" -w /src zricethezav/gitleaks:v8.21.2
      git /src --config /src/.gitleaks.toml --no-banner --redact
    - ./scripts/scan.sh secrets

lint:
  stage: lint
  script:
    - ./scripts/scan.sh lint-yaml lint-tf lint-ansible lint-docker helm kubeconform

test:unit:
  stage: test
  image: golang:1.26-alpine
  before_script: []
  script:
    - cd app && go vet ./... && go test -count=1 -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

sast:
  stage: sast
  script:
    - ./scripts/scan.sh sast-semgrep sast-gosec
  artifacts:
    when: always
    paths: [reports/semgrep.sarif]

sca:
  stage: sca
  script:
    - ./scripts/scan.sh sca-govuln sca-trivy

iac-scan:
  stage: iac-scan
  script:
    - ./scripts/scan.sh iac-checkov iac-trivy
  artifacts:
    when: always
    paths: [reports/]

policy:
  stage: policy
  script:
    - apk add --no-cache kubectl >/dev/null 2>&1 || true
    - ./scripts/scan.sh policy policy-kyverno

build:
  stage: build
  script:
    - docker build -t demo-app:dev --build-arg VERSION=$CI_COMMIT_SHORT_SHA app
    - ./scripts/scan.sh image
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker tag demo-app:dev "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" | cut -d@ -f2 > digest.txt
  artifacts:
    paths: [digest.txt]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

sbom:
  stage: sbom
  script:
    - docker build -t demo-app:dev app
    - ./scripts/scan.sh sbom
  artifacts:
    paths: [reports/sbom.cdx.json, reports/sbom.txt]
    reports:
      cyclonedx: reports/sbom.cdx.json

sign:
  stage: sign
  needs: [build, sbom]
  image: alpine:3.20
  before_script: []
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - apk add --no-cache cosign >/dev/null
    - DIGEST=$(cat digest.txt)
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN"
    - cosign sign --yes "$IMAGE_NAME@$DIGEST"
    - cosign attest --yes --type cyclonedx --predicate reports/sbom.cdx.json "$IMAGE_NAME@$DIGEST"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy and DAST run against a disposable k3s-in-Docker cluster on the runner host.
# The job container joins the lab network, so it talks to node addresses, not loopback.
deploy:ephemeral:
  stage: deploy
  image: golang:1.26-alpine
  # One lab subnet per runner host, so deploy jobs run one at a time.
  resource_group: lab-cluster
  variables:
    LAB_JOIN_NETWORK: "1"
    INGRESS_ADDR: 10.10.10.10   # server node IP on the lab network
    HTTPS_PORT: "443"
    TF_VERSION: "1.9.8"
  before_script:
    - apk add --no-cache bash git curl make docker-cli kubectl openssl >/dev/null
    - cd /tmp
    - curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
    - curl -fsSLO "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS"
    - grep "linux_amd64.zip" "terraform_${TF_VERSION}_SHA256SUMS" | sha256sum -c -
    - unzip -q "terraform_${TF_VERSION}_linux_amd64.zip" -d /usr/local/bin && cd "$CI_PROJECT_DIR"
  script:
    - make up
    - make e2e
    - make dast
  after_script:
    - make down || true
  artifacts:
    when: always
    paths: [reports/zap*]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
