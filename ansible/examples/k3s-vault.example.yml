---
# Copy to group_vars/k3s/vault.yml, fill in, then: ansible-vault encrypt group_vars/k3s/vault.yml
# Kept outside group_vars so Ansible never loads these placeholders as real values.
# vault.yml is git-ignored; only this example is committed.
vault_k3s_token: "generate-with: openssl rand -hex 32"
vault_k3s_sha256: "sha256 of the k3s binary from the release sha256sum-amd64.txt"
