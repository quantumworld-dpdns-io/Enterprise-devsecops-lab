# Example inventory for the Proxmox environment (terraform/environments/proxmox).
# Copy to inventory/proxmox.yml (git-ignored) and adjust. All addresses are lab examples.
all:
  vars:
    ansible_user: labadmin
    ansible_python_interpreter: /usr/bin/python3
  children:
    k3s:
      children:
        k3s_server:
          hosts:
            k3s-server-1: { ansible_host: 10.10.10.10 }
        k3s_agent:
          hosts:
            k3s-agent-1: { ansible_host: 10.10.10.11 }
            k3s-agent-2: { ansible_host: 10.10.10.12 }
    runners:
      hosts:
        runner-1: { ansible_host: 10.10.10.20 }
    security:
      hosts:
        sec-vm-1: { ansible_host: 192.168.100.10 }
