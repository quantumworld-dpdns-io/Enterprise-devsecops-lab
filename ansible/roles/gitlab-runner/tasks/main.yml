---
- name: Install prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, docker.io]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add GitLab Runner apt signing key
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/runner/gitlab-runner/gpgkey
    dest: /etc/apt/keyrings/gitlab-runner.asc
    owner: root
    group: root
    mode: "0644"

- name: Add GitLab Runner apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/gitlab-runner.asc]
      https://packages.gitlab.com/runner/gitlab-runner/{{ ansible_distribution | lower }}/
      {{ ansible_distribution_release }} main
    filename: gitlab-runner
    state: present

- name: Install gitlab-runner
  ansible.builtin.apt:
    name: gitlab-runner
    state: present

- name: Add gitlab-runner to the docker group
  ansible.builtin.user:
    name: gitlab-runner
    groups: docker
    append: true

- name: Create builds directory shared with job containers
  ansible.builtin.file:
    path: /builds
    state: directory
    owner: gitlab-runner
    group: gitlab-runner
    mode: "0750"

- name: Create runner certs directory
  ansible.builtin.file:
    path: /etc/gitlab-runner/certs
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install extra CA bundle for the egress proxy
  ansible.builtin.copy:
    src: "{{ gitlab_runner_extra_ca_file }}"
    dest: /etc/gitlab-runner/certs/egress-proxy-ca.crt
    owner: root
    group: root
    mode: "0644"
  when: gitlab_runner_extra_ca_file | length > 0
  notify: Restart gitlab-runner

- name: Write runner configuration
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/gitlab-runner/config.toml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart gitlab-runner

- name: Verify runner can authenticate
  ansible.builtin.command: gitlab-runner verify --name {{ gitlab_runner_name }}
  register: gitlab_runner_verify
  changed_when: false
  failed_when: "'is valid' not in gitlab_runner_verify.stderr and 'is alive' not in gitlab_runner_verify.stderr"
