---
k3s_version: v1.31.4+k3s1
# sha256 of the k3s binary for k3s_version (from the release's sha256sum-amd64.txt).
# Verifying it means a compromised mirror cannot hand us a different binary.
k3s_sha256: ""
k3s_release_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}"

# server | agent, normally set per inventory group.
k3s_role: agent
k3s_server_url: "https://{{ hostvars[groups['k3s_server'][0]].ansible_host }}:6443"
# Join token. Keep it in ansible-vault: group_vars/k3s/vault.yml (vault_k3s_token).
k3s_token: "{{ vault_k3s_token }}"

k3s_cluster_cidr: 10.20.0.0/16
k3s_service_cidr: 10.21.0.0/16
k3s_tls_san: []
k3s_node_labels: []
k3s_node_taints: []
k3s_disable: [servicelb]
k3s_secrets_encryption: true
k3s_extra_args: {}

# Air-gapped installs: drop the images tarball next to the binary instead of pulling.
k3s_airgap: false
k3s_airgap_images_src: ""   # local path to k3s-airgap-images-amd64.tar.zst

# Private registry mirror (registries.yaml). Empty = pull from upstream.
k3s_registry_mirrors: {}
#  docker.io:
#    endpoint: ["https://registry.lab.example"]
k3s_registry_ca_file: ""
