---
- name: Validate inputs
  ansible.builtin.assert:
    that:
      - k3s_role in ['server', 'agent']
      - k3s_sha256 | length == 64
      - k3s_token | length >= 32
    fail_msg: k3s_role must be server|agent, k3s_sha256 must be set, k3s_token must be >= 32 chars (vault)
    quiet: true

- name: Kernel modules for container networking
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: [overlay, br_netfilter]

- name: Kernel parameters for pod networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/70-k3s.conf
    reload: true
  loop: "{{ {'net.ipv4.ip_forward': 1, 'net.bridge.bridge-nf-call-iptables': 1, 'net.bridge.bridge-nf-call-ip6tables': 1} | dict2items }}"

- name: Download k3s binary with checksum verification
  ansible.builtin.get_url:
    url: "{{ k3s_release_url }}/k3s"
    dest: /usr/local/bin/k3s
    checksum: "sha256:{{ k3s_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s

- name: Air-gap image bundle
  when: k3s_airgap
  block:
    - name: Create images directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/agent/images
        state: directory
        owner: root
        group: root
        mode: "0700"
    - name: Copy images tarball
      ansible.builtin.copy:
        src: "{{ k3s_airgap_images_src }}"
        dest: /var/lib/rancher/k3s/agent/images/
        owner: root
        group: root
        mode: "0600"

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write API audit policy (server)
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/audit-policy.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      apiVersion: audit.k8s.io/v1
      kind: Policy
      omitStages: [RequestReceived]
      rules:
        # Never log secret payloads, only who touched them.
        - level: Metadata
          resources:
            - group: ""
              resources: [secrets, configmaps, serviceaccounts/token]
        - level: RequestResponse
          verbs: [create, update, patch, delete]
          resources:
            - group: rbac.authorization.k8s.io
            - group: networking.k8s.io
              resources: [networkpolicies]
        - level: Metadata
          verbs: [create, update, patch, delete]
        - level: None
  when: k3s_role == 'server'
  notify: Restart k3s

- name: Write k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: Write registry mirrors
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0600"
  when: k3s_registry_mirrors | length > 0
  notify: Restart k3s

- name: Install systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Enable and start k3s
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the API on the server
  ansible.builtin.wait_for:
    port: 6443
    timeout: 180
  when: k3s_role == 'server'

- name: Wait for this node to be Ready
  ansible.builtin.command: >-
    k3s kubectl get node {{ ansible_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_node_ready
  until: k3s_node_ready.stdout == 'True'
  retries: 30
  delay: 10
  changed_when: false
  delegate_to: "{{ groups['k3s_server'][0] }}"
