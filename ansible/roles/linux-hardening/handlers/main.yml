---
- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted
  when: not hardening_in_container

- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: not hardening_in_container
