# Self-hosted GitLab CE + a Docker-executor runner, for exercising .gitlab-ci.yml locally.
#   docker compose -f gitlab/docker-compose.yml up -d     (first boot takes ~5 minutes, ~4 GB RAM)
#   ./gitlab/bootstrap.sh                                  (root token, project, runner registration)
# Bound to loopback only. Not a production deployment: no backups, no external TLS.
name: lab-gitlab

services:
  gitlab:
    image: gitlab/gitlab-ce:17.11.7-ce.0
    hostname: gitlab.lab.example
    restart: unless-stopped
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.lab.example:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        gitlab_rails['initial_root_password'] = File.read('/run/secrets/gitlab_root_password').strip
        gitlab_rails['usage_ping_enabled'] = false
        gitlab_rails['gitlab_signup_enabled'] = false
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
    ports:
      - "127.0.0.1:8929:8929"
      - "127.0.0.1:2224:22"
    secrets: [gitlab_root_password]
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    networks:
      default:
        # Job containers clone from external_url, so the name must resolve on this network.
        aliases: [gitlab.lab.example]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8929/-/readiness"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  runner:
    image: gitlab/gitlab-runner:v17.11.3
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside: jobs start sibling containers that mount
      # $CI_PROJECT_DIR by host path (see the .gitlab-ci.yml header).
      - /builds:/builds

secrets:
  gitlab_root_password:
    file: ./.secrets/root_password   # created by bootstrap.sh, git-ignored

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:
