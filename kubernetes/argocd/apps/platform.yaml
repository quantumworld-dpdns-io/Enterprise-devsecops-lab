apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: lab
  source:
    repoURL: https://github.com/dennislee928/enterprise-devsecops-lab.git
    targetRevision: main
    path: kubernetes/platform/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: demo   # default for namespaced objects without one; manifests set their own
  syncPolicy:
    automated:
      prune: false   # namespaces and the CA are never auto-deleted
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
