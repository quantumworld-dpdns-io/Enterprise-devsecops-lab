# Two trust levels:
#   platform: cluster add-ons (CNI, policy engine, observability). May create CRDs,
#             cluster roles and admission webhooks. Changes need platform-team review.
#   lab:      workloads. Namespaced resources only, in an explicit namespace list.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster add-ons managed by the platform team.
  sourceRepos:
    - https://github.com/dennislee928/enterprise-devsecops-lab.git
    - https://helm.cilium.io
    - https://kyverno.github.io/kyverno
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: cert-manager
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: kyverno.io
      kind: ClusterPolicy
    - group: ""
      kind: Namespace
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: cilium.io
      kind: CiliumClusterwideNetworkPolicy
  orphanedResources:
    warn: true
