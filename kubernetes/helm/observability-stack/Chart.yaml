apiVersion: v2
name: observability-stack
description: >-
  Metrics, logs and traces for the lab in one release: kube-prometheus-stack, Loki,
  Tempo, Alloy and the OpenTelemetry Collector, plus the demo-app dashboard and SLO alerts.
type: application
version: 0.1.0
appVersion: "1.0"
kubeVersion: ">=1.28.0-0"
maintainers:
  - name: Dennis Lee
# Versions mirror kubernetes/charts.txt. Bump both together.
dependencies:
  - name: kube-prometheus-stack
    version: 91.9.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    version: 7.3.0
    repository: https://grafana.github.io/helm-charts
  - name: tempo
    version: 1.24.4
    repository: https://grafana.github.io/helm-charts
  - name: alloy
    version: 1.13.0
    repository: https://grafana.github.io/helm-charts
  - name: opentelemetry-collector
    version: 0.175.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
