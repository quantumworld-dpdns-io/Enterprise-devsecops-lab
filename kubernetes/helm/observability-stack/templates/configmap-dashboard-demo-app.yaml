{{- if .Values.demoApp.dashboard }}
# Grafana picks this up through the dashboard sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  demo-app.json: |
    {
      "title": "demo-app - golden signals",
      "uid": "demo-app",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries", "title": "Requests per second by route",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (route) (demo:http_requests:rate5m)", "legendFormat": "{{`{{route}}`}}" }]
        },
        {
          "type": "timeseries", "title": "Error ratio (5xx)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [{ "expr": "sum(rate(demo_http_requests_total{code=~\"5..\"}[5m])) / clamp_min(sum(rate(demo_http_requests_total[5m])), 1e-9)" }]
        },
        {
          "type": "timeseries", "title": "p95 latency by route",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [{ "expr": "demo:http_latency_p95:5m", "legendFormat": "{{`{{route}}`}}" }]
        },
        {
          "type": "logs", "title": "demo-app logs",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "expr": "{namespace=\"demo\", app=\"demo-app\"}" }]
        }
      ]
    }
{{- end }}
