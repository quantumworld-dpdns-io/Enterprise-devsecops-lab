# Private lab CA, the same shape as an internal enterprise PKI:
# a self-signed bootstrap issuer mints one root, and a CA issuer signs leaf certs.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-ca-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: Lab Example Root CA
  secretName: lab-ca-root
  duration: 87600h # 10y, lab only
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca-root
