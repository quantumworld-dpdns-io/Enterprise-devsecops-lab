# Offline policy tests: `kyverno test kubernetes/supply-chain/tests`
# (signature verification needs Rekor/registry access and is exercised in CI instead).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: supply-chain-registry-policy
policies:
  - ../verify-images.yaml
resources:
  - resources.yaml
results:
  - policy: restrict-image-registries
    rule: allowed-registries
    resources: [allowed-project-image]
    kind: Pod
    result: pass
  - policy: restrict-image-registries
    rule: allowed-registries
    resources: [docker-hub-image]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    rule: allowed-registries
    resources: [sneaky-init-container]
    kind: Pod
    result: fail
